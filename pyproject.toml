[project]
name = "inbox-agent"
version = "0.1.0"
description = "Personal AI assistant that monitors Outlook, Notion meetings, and a kanban board"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "msgraph-sdk>=1.0.0",
    "azure-identity>=1.14.0",
    "notion-client>=2.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
]

[project.scripts]
inbox-agent = "inbox_agent.main:cli"
inbox-agent-cli = "inbox_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
